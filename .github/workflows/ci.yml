name: Build Package

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munctl'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (Lint & Build)
        run: pnpm verify

      - name: Run Unit Tests
        run: pnpm test

      - name: Publish to GitHub Packages
        run: |
          npm version $(node -p "require('./package.json').version")-nightly-${{ github.run_id }} --no-git-tag-version
          pnpm publish --no-git-checks --tag nightly
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
